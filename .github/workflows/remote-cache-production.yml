name: Remote cache production

on:
  workflow_dispatch:

permissions:
  contents: read

# Finish one production deployment before starting the next.
concurrency:
  group: remote-cache-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
      - run: pnpm check
      - run: pnpm smoke
      # The script accepts only manual runs of this repository's main branch.
      - name: Deploy the production Worker, D1, and R2
        id: deploy
        run: pnpm ci:deploy production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
