packages:
  - .

minimumReleaseAgeExclude:
  - '@cloudflare/*'
  - miniflare
  - workerd
  - wrangler

allowBuilds:
  esbuild: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 5.1.2
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
