packages:
  - .

minimumReleaseAgeExclude:
  - '@cloudflare/*'
  - miniflare
  - workerd
  - wrangler

allowBuilds:
  esbuild: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 5.1.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
